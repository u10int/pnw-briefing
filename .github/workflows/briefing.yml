name: Daily forecast briefing

on:
  schedule:
    # 15:17 UTC = 7:17 AM PST / 8:17 AM PDT. The 12Z HRRR, RRFS, NAM and NBM runs
    # are complete by then, alongside the 00Z globals and ensembles.
    # Odd minute avoids the top-of-hour queue.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Render with synthetic data (layout test, no downloads)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Natural Earth outlines
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-10m-v1

      - name: Cache PRISM normals
        uses: actions/cache@v4
        with:
          path: .cache/prism
          key: prism-ppt-normals-4km-v1

      - name: Get yesterday's briefing for the change view
        run: |
          # the latest published briefing.json, if the site exists yet
          git fetch --depth=1 origin gh-pages 2>/dev/null && \
            git show origin/gh-pages:data/briefing.json > previous.json 2>/dev/null || rm -f previous.json
          ls -la previous.json 2>/dev/null || echo "no previous briefing yet"

      - name: Preflight checks (environment and data hosts)
        if: ${{ !inputs.demo }}
        shell: micromamba-shell {0}
        env: { PYTHONUNBUFFERED: "1" }
        run: python -m briefing.check

      - name: Fetch models and write briefing data
        shell: micromamba-shell {0}
        run: |
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          export PYTHONUNBUFFERED=1
          PREV=""; [ -s previous.json ] && PREV="--previous previous.json"
          python -m briefing.main --out web/public/data $PREV ${{ inputs.demo && '--demo' || '' }}

      - name: Build the page (React + shadcn/ui)
        working-directory: web
        env:
          # optional CARTO basemap key (Settings → Secrets and variables → Actions → Variables)
          VITE_CARTO_KEY: ${{ vars.CARTO_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site (latest page, dated archive, pruning)
        run: scripts/assemble_site.sh web/dist "$DATE"

      - name: Publish to gh-pages as a single commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish_site.sh \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "Briefing ${DATE}"
