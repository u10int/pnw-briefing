name: Daily forecast briefing

on:
  schedule:
    # 15:13 UTC = 7:13 AM PST / 8:13 AM PDT. The 12Z HRRR, RRFS, NAM and NBM runs
    # are complete by then, alongside the 00Z globals and ensembles.
    # GitHub runs schedules late or not at all when it's busy, so two backup times
    # follow. Whichever runs first builds the briefing; the others see today's
    # morning edition on gh-pages and stop. The evening edition comes from an
    # external scheduler (workflow_dispatch with skip_if_published).
    - cron: "13 15 * * *"
    - cron: "13 16 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Render with synthetic data (layout test, no downloads)"
        type: boolean
        default: false
      page_only:
        description: "Rebuild the page only: reuse the published data with the current code (no downloads)"
        type: boolean
        default: false
      skip_if_published:
        description: "Skip if this edition (morning or evening) is already published today (for external schedulers)"
        type: boolean
        default: false
      edition:
        description: "Which edition this run is (auto: morning before 2 PM Pacific, evening after)"
        type: choice
        options: [auto, morning, evening]
        default: auto

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      edition: ${{ steps.check.outputs.edition }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Two editions a day: morning (before 2 PM Pacific) and evening. Manual runs always go
          # ahead. A scheduled run, or a dispatch with skip_if_published, stops if its edition is
          # already out today: the morning edition once anything is archived for today, the
          # evening edition once its marker (archive/editions/<date>-evening) is published.
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          EDITION="${{ inputs.edition }}"
          if [ -z "$EDITION" ] || [ "$EDITION" = "auto" ]; then
            [ "$(TZ=America/Los_Angeles date +%-H)" -lt 14 ] && EDITION=morning || EDITION=evening
          fi
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          if [ "$EDITION" = morning ]; then MARK="archive/${TODAY}"; else MARK="archive/editions/${TODAY}-evening"; fi
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_published }}" = "true" ]; } &&
             gh api "repos/${GITHUB_REPOSITORY}/contents/${MARK}?ref=gh-pages" --silent 2>/dev/null; then
            echo "$EDITION briefing for $TODAY already published; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "building the $EDITION briefing for $TODAY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Natural Earth outlines
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-10m-v1

      - name: Cache PRISM normals
        uses: actions/cache@v4
        with:
          path: .cache/prism
          key: prism-normals-4km-v2   # precipitation, high and low normals

      - name: Get yesterday's briefing for the change view
        if: ${{ !inputs.page_only }}
        run: |
          # The newest archived briefing from an earlier day, so a second run on the same day
          # (manual, or a late schedule) still compares with yesterday rather than with itself.
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          rm -f previous.json
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            PREV=$(git ls-tree --name-only origin/gh-pages archive/ 2>/dev/null | sed 's#^archive/##' \
                   | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | awk -v t="$TODAY" '$0 < t' | sort | tail -1)
            if [ -n "$PREV" ] && git show "origin/gh-pages:archive/$PREV/data/briefing.json" > previous.json 2>/dev/null; then
              echo "comparing with the briefing from $PREV"
            else
              rm -f previous.json
            fi
          fi
          ls -la previous.json 2>/dev/null || echo "no earlier briefing yet"

      - name: Preflight checks (environment and data hosts)
        if: ${{ !inputs.demo && !inputs.page_only }}
        shell: micromamba-shell {0}
        env: { PYTHONUNBUFFERED: "1" }
        run: python -m briefing.check

      - name: Fetch models and write briefing data
        if: ${{ !inputs.page_only }}
        shell: micromamba-shell {0}
        run: |
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          export PYTHONUNBUFFERED=1
          PREV=""; [ -s previous.json ] && PREV="--previous previous.json"
          python -m briefing.main --out web/public/data $PREV ${{ inputs.demo && '--demo' || '' }}

      - name: Reuse the published briefing data (page-only rebuild)
        if: ${{ inputs.page_only }}
        shell: micromamba-shell {0}
        run: |
          # The latest data/ from gh-pages (briefing.json, maps, COGs, hourly fields), with the
          # labels that come straight from config.yaml refreshed. The archive date is the
          # briefing's own date, so a rebuild the next morning doesn't file it under the wrong day.
          git fetch --depth=1 origin gh-pages
          rm -rf web/public/data && mkdir -p web/public
          git archive FETCH_HEAD data | tar -x -C web/public
          DATE=$(python -m briefing.repage web/public/data/briefing.json)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "rebuilding the page for the briefing of $DATE"

      - name: Build the page (React + shadcn/ui)
        working-directory: web
        env:
          # optional CARTO basemap key (Settings → Secrets and variables → Actions → Variables)
          VITE_CARTO_KEY: ${{ vars.CARTO_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site (latest page, dated archive, pruning)
        # a page-only rebuild doesn't count as an edition
        run: scripts/assemble_site.sh web/dist "$DATE" "${{ !inputs.page_only && needs.gate.outputs.edition || '' }}"

      - name: Publish to gh-pages as a single commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish_site.sh \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${{ inputs.page_only && 'Page rebuild' || 'Briefing' }} ${DATE}"
