name: Daily forecast briefing

on:
  schedule:
    # Four editions a day, one per model cycle (00, 06, 12 and 18Z). GitHub cron times are UTC.
    # The external scheduler starts each edition about 4.5 h after its cycle, once the
    # high-resolution runs and the GFS are out:
    #   00Z → 04:30 UTC   06Z → 10:30 UTC   12Z → 16:30 UTC   18Z → 22:30 UTC
    # (8:30 PM, 2:30 AM, 8:30 AM and 2:30 PM PST; an hour later in PDT). These crons, an hour
    # after that, are backups only: GitHub can start them hours late or skip them, and each one
    # stops if its cycle's edition is already published.
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Render with synthetic data (layout test, no downloads)"
        type: boolean
        default: false
      page_only:
        description: "Rebuild the page only: reuse the published data with the current code (no downloads)"
        type: boolean
        default: false
      skip_if_published:
        description: "Skip if this cycle's edition is already published (for external schedulers)"
        type: boolean
        default: false
      cycle:
        description: "Model cycle to build, e.g. 2026-11-07T18Z (auto: the latest 00/06/12/18Z at least 3 h old)"
        type: string
        default: auto
      edition:
        description: "Deprecated, ignored (editions now follow the model cycle)"
        type: string
        default: auto

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      cycle: ${{ steps.check.outputs.cycle }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Four editions a day, one per model cycle. An edition is named for the latest
          # 00/06/12/18Z at least 3 hours old, so a late start still builds the cycle it was meant
          # for. Manual runs always go ahead; a scheduled run, or a dispatch with
          # skip_if_published, stops if that cycle's edition (archive/editions/<cycle>.json) is out.
          CYCLE="${{ inputs.cycle }}"
          if [ -z "$CYCLE" ] || [ "$CYCLE" = "auto" ]; then
            T=$(date -u -d '3 hours ago' +%s)
            H=$(( 10#$(date -u -d "@$T" +%H) / 6 * 6 ))
            CYCLE="$(date -u -d "@$T" +%Y-%m-%d)T$(printf %02d $H)Z"
          fi
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_published }}" = "true" ]; } &&
             gh api "repos/${GITHUB_REPOSITORY}/contents/archive/editions/${CYCLE}.json?ref=gh-pages" --silent 2>/dev/null; then
            echo "the $CYCLE edition is already published; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "building the $CYCLE edition"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Natural Earth outlines
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-10m-v1

      - name: Cache PRISM normals
        uses: actions/cache@v4
        with:
          path: .cache/prism
          key: prism-normals-4km-v2   # precipitation, high and low normals

      - name: Get yesterday's briefing for the change view
        if: ${{ !inputs.page_only }}
        env:
          CYCLE: ${{ needs.gate.outputs.cycle }}
        run: |
          # Yesterday's edition from the same cycle (so its first day is just as partial), or
          # failing that the newest daily archive from an earlier day.
          C="${CYCLE%Z}"
          DATE=$(date -u -d "${C/T/ }:00 UTC - 12 hours" +%Y-%m-%d)
          PREVC="$(date -u -d "${C/T/ }:00 UTC - 24 hours" +%Y-%m-%dT%H)Z"
          rm -f previous.json
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            if git show "origin/gh-pages:archive/editions/$PREVC.json" > previous.json 2>/dev/null; then
              echo "comparing with the $PREVC edition"
            else
              PREV=$(git ls-tree --name-only origin/gh-pages archive/ 2>/dev/null | sed 's#^archive/##' \
                     | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | awk -v t="$DATE" '$0 < t' | sort | tail -1)
              if [ -n "$PREV" ] && git show "origin/gh-pages:archive/$PREV/data/briefing.json" > previous.json 2>/dev/null; then
                echo "comparing with the briefing from $PREV"
              else
                rm -f previous.json
              fi
            fi
          fi
          ls -la previous.json 2>/dev/null || echo "no earlier briefing yet"
          # one briefing per earlier day (the daily archive keeps each day's 12Z edition): the
          # trends table's run-to-run sparklines, the model verification and the analysed
          # temperatures already fetched
          rm -rf history && mkdir -p history
          for D in $(git ls-tree --name-only origin/gh-pages archive/ 2>/dev/null | sed 's#^archive/##' \
                     | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | awk -v t="$DATE" '$0 < t' | sort | tail -14); do
            git show "origin/gh-pages:archive/$D/data/briefing.json" > "history/$D.json" 2>/dev/null || rm -f "history/$D.json"
          done
          echo "$(ls history | wc -l) earlier briefings for the trend history"

      - name: Preflight checks (environment and data hosts)
        if: ${{ !inputs.demo && !inputs.page_only }}
        shell: micromamba-shell {0}
        env: { PYTHONUNBUFFERED: "1" }
        run: python -m briefing.check

      - name: Fetch models and write briefing data
        if: ${{ !inputs.page_only }}
        shell: micromamba-shell {0}
        env:
          # optional: lets a language model word the headline and lead (Settings → Secrets → Actions)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          C="${{ needs.gate.outputs.cycle }}"; C="${C%Z}"
          # the briefing's day: the 12Z – 12Z day its cycle falls in (an overnight 06Z edition
          # belongs to the evening before)
          DATE=$(date -u -d "${C/T/ }:00 UTC - 12 hours" +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "CYCLE=${{ needs.gate.outputs.cycle }}" >> "$GITHUB_ENV"
          export PYTHONUNBUFFERED=1
          PREV=""; [ -s previous.json ] && PREV="--previous previous.json"
          python -m briefing.main --out web/public/data $PREV --history history --cycle "$CYCLE" ${{ inputs.demo && '--demo' || '' }}

      - name: Reuse the published briefing data (page-only rebuild)
        if: ${{ inputs.page_only }}
        shell: micromamba-shell {0}
        env:
          # the headline and lead are rewritten from the published facts
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # The latest data/ from gh-pages (briefing.json, maps, COGs, hourly fields), with the
          # labels that come straight from config.yaml refreshed. The archive date is the
          # briefing's own date, so a rebuild the next morning doesn't file it under the wrong day.
          git fetch --depth=1 origin gh-pages
          rm -rf web/public/data && mkdir -p web/public
          git archive FETCH_HEAD data | tar -x -C web/public
          read -r DATE CYCLE < <(python -m briefing.repage web/public/data/briefing.json)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "rebuilding the page for the briefing of $DATE"

      - name: Build the page (React + shadcn/ui)
        working-directory: web
        env:
          # optional CARTO basemap key (Settings → Secrets and variables → Actions → Variables)
          VITE_CARTO_KEY: ${{ vars.CARTO_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site (latest page, dated archive, pruning)
        # a page-only rebuild doesn't count as an edition
        run: scripts/assemble_site.sh web/dist "$DATE" "$CYCLE" "${{ !inputs.page_only && 'mark' || '' }}"

      - name: Publish to gh-pages as a single commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish_site.sh \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${{ inputs.page_only && 'Page rebuild' || 'Briefing' }} ${DATE}"
