name: probe-mrms3d
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-file: environment.yml, cache-environment: true }
      - shell: micromamba-shell {0}
        run: python probe/inv.py
