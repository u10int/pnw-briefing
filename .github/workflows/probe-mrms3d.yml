name: probe-mrms3d
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sed -e 's#from "./mrms"#from "./shim-mrms"#' -e 's#from "./volume"#from "../web/src/lib/volume"#' web/src/lib/mrms3d.ts > probe/mrms3d.ts && npx -y esbuild@0.25.0 probe/run.ts --bundle --platform=node --outfile=/tmp/run.cjs --log-level=warning && node /tmp/run.cjs
