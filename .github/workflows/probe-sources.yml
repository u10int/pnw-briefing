name: Temporary page probe
on:
  push:
    branches: [probe/sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Build the page with the published data
        run: |
          git fetch --depth=1 origin gh-pages
          rm -rf web/public/data && mkdir -p web/public
          git archive FETCH_HEAD data | tar -x -C web/public
          pip install pyyaml >/dev/null && python -m briefing.repage web/public/data/briefing.json
          cd web && npm ci && npm run build
      - name: Screenshots with the real basemap and terrain
        run: |
          cd web && npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
          (cd dist && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright"
          const b = await chromium.launch({ args: ["--use-gl=angle", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"] })
          const pg = await b.newPage({ viewport: { width: 1320, height: 1000 } })
          const errs = []; pg.on("pageerror", (e) => errs.push(String(e)))
          const fails = []; pg.on("requestfailed", (r) => fails.push(r.url().slice(0, 90)))
          await pg.goto("http://localhost:8080/", { waitUntil: "networkidle" })
          const card = pg.locator("[data-slot=card]", { has: pg.locator("[data-slot=card-title]", { hasText: "Explore the grids" }) }).first()
          await card.scrollIntoViewIfNeeded()
          await pg.waitForTimeout(5000)
          await card.screenshot({ path: "/tmp/shots/summary_terrain.png" })
          await card.getByRole("tab", { name: "Through time", exact: true }).click()
          await card.getByRole("tab", { name: "Pressure gradient", exact: true }).click()
          await pg.waitForTimeout(1500)
          await card.getByRole("combobox").first().click()
          await pg.getByRole("option", { name: "ECMWF AIFS", exact: true }).click()
          const iso = card.getByLabel("Isobars")
          if (!(await iso.isChecked())) await iso.click()
          await pg.waitForTimeout(2000)
          const slider = card.getByRole("slider", { name: "Forecast time" })
          await slider.focus()
          for (let k = 0; k < 28; k++) await pg.keyboard.press("ArrowRight")
          await pg.waitForTimeout(7000)
          await card.screenshot({ path: "/tmp/shots/pgrad.png" })
          await card.getByRole("tab", { name: "Wind", exact: true }).click()
          await pg.waitForTimeout(6000)
          await card.screenshot({ path: "/tmp/shots/pairs_wind.png" })
          console.log("errors", JSON.stringify(errs), "failed requests", JSON.stringify(fails.slice(0, 10)))
          await b.close()
          JS
          mkdir -p /tmp/shots && node shot.mjs
      - if: always()
        name: Push the screenshots to a scratch branch
        run: |
          mkdir -p /tmp/shotrepo && cd /tmp/shotrepo && git init -q -b probe/shots
          cp /tmp/shots/*.png . 2>/dev/null || true
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -q -m shots
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe/shots
