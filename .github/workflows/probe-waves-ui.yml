name: probe-waves-ui
on: {push: {branches: [probe-waves-ui]}}
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci >/dev/null 2>&1 && npx vite build --outDir /tmp/site >/dev/null
      - run: |
          git fetch -q --depth 1 origin gh-pages
          mkdir -p /tmp/gp && git archive origin/gh-pages data | tar -x -C /tmp/gp
          cp -r /tmp/gp/data /tmp/site/data
      - uses: mamba-org/setup-micromamba@v2
        with: {environment-file: environment.yml, cache-environment: true}
      - shell: micromamba-shell {0}
        run: PYTHONPATH=. python probe/addwaves.py /tmp/site/data 2>&1 | grep -v "^INFO:herbie\|Found ┊\|Download" | tail -40
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          (cd /tmp/site && python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 1
          mkdir -p probe-out && cp probe/shot.cjs /tmp/pw/shot.cjs && sed -i "s#../probe-out/#$GITHUB_WORKSPACE/probe-out/#" /tmp/pw/shot.cjs && (cd /tmp/pw && node shot.cjs)
      - run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe-out && git commit -qm "probe output" && git push -q origin HEAD:probe-waves-ui
