name: probe-waves
on: {push: {branches: [probe-waves]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && mkdir -p probe-out && python probe/rdwps.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out && git commit -qm "probe output" && git push
