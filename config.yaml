    - {name: Columbia River mouth,   lat: 46.25, lon: -124.20, near: Astoria, area: Outer coast}
    - {name: Off Tillamook,          lat: 45.50, lon: -124.05, near: Tillamook, area: Outer coast}
    - {name: Off Newport,            lat: 44.60, lon: -124.20, area: Outer coast}
    - {name: West Strait,            lat: 48.35, lon: -124.30, area: Strait and Puget Sound}
