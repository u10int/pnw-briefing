# PNW 14-day multi-model precipitation & impacts briefing — configuration
# Everything you are likely to tune lives here.

title: "PNW weather briefing"
timezone: America/Los_Angeles
days: 14

# Comparison windows, in 12Z-12Z days from today's 12Z.
windows:
  - {days: 2,  label: Next 48 hours}
  - {days: 7,  label: Next 7 days}
  - {days: 14, label: Next 14 days}

# Map / GRIB subset box (degrees, lon in -180..180). Wider than the comparison regions so the
# maps show southern B.C. (to Whistler), central Washington and Oregon, and a few hundred km of
# the Pacific, where the wind, rain and pressure systems come from.
domain:
  lat_min: 43.0
  lat_max: 51.0
  lon_min: -128.3
  lon_max: -118.5

# Comparison regions, west of the Cascade crest. Coarse hand-drawn polygons
# (lon, lat), coastline-ish on the west so ocean grid points are excluded.
regions:
  wwa:
    name: Western Washington
    short: W WA
    polygon:
      - [-124.73, 48.38]   # Cape Flattery
      - [-124.62, 47.90]
      - [-124.30, 47.30]
      - [-124.12, 46.90]
      - [-124.05, 46.28]   # Columbia mouth
      - [-123.40, 46.20]
      - [-122.90, 46.10]
      - [-122.77, 45.65]   # Vancouver WA
      - [-122.20, 45.55]
      - [-121.90, 45.66]
      - [-121.50, 46.20]   # Mt Adams (crest)
      - [-121.38, 46.64]   # White Pass
      - [-121.41, 47.42]   # Snoqualmie Pass
      - [-121.09, 47.75]   # Stevens Pass
      - [-120.75, 48.52]   # Washington Pass
      - [-120.85, 49.00]
      - [-123.05, 49.00]
      - [-123.10, 48.70]
      - [-123.25, 48.28]
      - [-124.00, 48.18]
  nwor:
    name: Northwest Oregon
    short: NW OR
    polygon:
      - [-124.05, 46.28]   # Columbia mouth
      - [-123.40, 46.20]
      - [-122.90, 46.10]
      - [-122.77, 45.65]
      - [-122.20, 45.55]
      - [-121.90, 45.66]
      - [-121.70, 45.37]   # Mt Hood (crest)
      - [-121.87, 44.42]   # Santiam Pass
      - [-121.95, 44.30]
      - [-124.12, 44.30]
      - [-124.08, 44.80]
      - [-123.97, 45.50]
      - [-123.96, 45.95]

# Atmospheric-river outlook: where the AR scale rank is read along the outer coast, north to south,
# a little offshore so every model's grid cell is over water. Each model's IVT here gives AR events
# (Ralph et al. 2019 scale: peak IVT and duration); a window's rank is the strongest event in it.
ar_coast:
  - {name: Cape Scott,        lat: 50.70, lon: -128.20}
  - {name: Brooks Peninsula,  lat: 50.10, lon: -127.95}
  - {name: Nootka Sound,      lat: 49.55, lon: -126.95}
  - {name: Tofino,            lat: 49.10, lon: -126.05}
  - {name: Ucluelet,          lat: 48.85, lon: -125.65}
  - {name: Port Renfrew,      lat: 48.50, lon: -124.65}
  - {name: Cape Flattery,     lat: 48.30, lon: -124.90}
  - {name: La Push,           lat: 47.90, lon: -124.75}
  - {name: Taholah,           lat: 47.35, lon: -124.45}
  - {name: Westport,          lat: 46.90, lon: -124.25}
  - {name: Long Beach,        lat: 46.40, lon: -124.20}
  - {name: Cannon Beach,      lat: 45.90, lon: -124.10}
  - {name: Tillamook Bay,     lat: 45.50, lon: -124.10}
  - {name: Lincoln City,      lat: 44.95, lon: -124.15}
  - {name: Newport,           lat: 44.60, lon: -124.20}
  - {name: Florence,          lat: 44.00, lon: -124.25}
  - {name: Coos Bay,          lat: 43.35, lon: -124.45}

# Forecast points. kind controls which impact thresholds apply. region assigns a point to a
# comparison region; leave it out for a location that shouldn't count toward any region. area
# names the part of the region it stands for and zone the wider area it belongs to; together they
# sum up an impact's locations ("Northern Puget Sound", then "Puget Sound").
points:
  - {name: Bellingham,       lat: 48.75, lon: -122.48, kind: lowland, region: wwa, area: Northern Puget Sound, zone: Puget Sound}
  - {name: Everett,          lat: 47.98, lon: -122.20, kind: lowland, region: wwa, area: Northern Puget Sound, zone: Puget Sound}
  - {name: Seattle,          lat: 47.61, lon: -122.33, kind: lowland, region: wwa, plume: true, area: Central Puget Sound, zone: Puget Sound}
  - {name: Tacoma,           lat: 47.25, lon: -122.44, kind: lowland, region: wwa, area: Southern Puget Sound, zone: Puget Sound}
  - {name: Olympia,          lat: 47.04, lon: -122.90, kind: lowland, region: wwa, area: Southern Puget Sound, zone: Puget Sound}
  - {name: Forks,            lat: 47.95, lon: -124.39, kind: coast,   region: wwa, area: Northern WA coast, zone: WA coast}
  - {name: Aberdeen,         lat: 46.98, lon: -123.82, kind: coast,   region: wwa, area: Central WA coast, zone: WA coast}
  - {name: Stevens Pass,     lat: 47.75, lon: -121.09, kind: pass,    region: wwa, elev_ft: 4061, area: Central WA Cascades, zone: WA Cascades}
  - {name: Snoqualmie Pass,  lat: 47.42, lon: -121.41, kind: pass,    region: wwa, plume: true, elev_ft: 3022, area: Central WA Cascades, zone: WA Cascades}
  - {name: White Pass,       lat: 46.64, lon: -121.38, kind: pass,    region: wwa, elev_ft: 4500, area: Southern WA Cascades, zone: WA Cascades}
  - {name: Vancouver WA,     lat: 45.64, lon: -122.66, kind: lowland, region: wwa, area: Portland metro, zone: Willamette Valley}
  - {name: Astoria,          lat: 46.19, lon: -123.83, kind: coast,   region: nwor, area: Northern OR coast, zone: OR coast}
  - {name: Tillamook,        lat: 45.46, lon: -123.84, kind: coast,   region: nwor, area: Northern OR coast, zone: OR coast}
  - {name: Portland,         lat: 45.52, lon: -122.68, kind: lowland, region: nwor, plume: true, area: Portland metro, zone: Willamette Valley}
  - {name: Salem,            lat: 44.94, lon: -123.04, kind: lowland, region: nwor, area: Central Willamette Valley, zone: Willamette Valley}
  - {name: Corvallis,        lat: 44.56, lon: -123.26, kind: lowland, region: nwor, area: Southern Willamette Valley, zone: Willamette Valley}
  - {name: Government Camp,  lat: 45.30, lon: -121.75, kind: pass,    region: nwor, plume: true, elev_ft: 3980, area: Northern OR Cascades, zone: OR Cascades}
  # outside the comparison regions (no PRISM normals or NWS alerts in Canada)
  - {name: Vancouver BC,     lat: 49.28, lon: -123.12, kind: lowland, area: Lower Mainland BC, zone: Southwest BC}
  - {name: Whistler BC,      lat: 50.12, lon: -122.95, kind: pass,    elev_ft: 2214, area: Sea to Sky BC, zone: Southwest BC}   # village; pass thresholds for snow

# ----------------------------------------------------------------------------
# GRIB models — the primary source. NOAA models come from NODD (AWS, with
# NOMADS/Google fallbacks); ECMWF from its open-data service. `herbie` is
# passed straight to herbie.Herbie(); `cycles` are the runs worth using;
# `range_days` caps how many 12Z-12Z days to take; `sample_hours` is the
# spacing of the temperature/gust samples used for daily max/min.
#
# `extremes` sets how highs, lows, strongest wind and gusts are read: at the model's native output
# steps (`step`, or `steps` as [[up_to_fxx, step_hours], ...]), with `temp: maxmin` to use the
# model's 2 m max/min-since-last-output records and `wind: max` its hourly max 10 m wind
# (`maxuv` when published as components, `speed` for NBM's instantaneous 10 m speed). Models without it use `sample_hours` instantaneous values.
#
# `fields` adds time-stepped grids to the interactive map. Temperature and gusts come from the
# samples above for free (listing them under `hourly` adds the hours in between). `stepped` fields
# are taken every `sample_hours`; `hourly` fields every hour for the first `hourly_hours`. A regional
# model's map runs to its `max_hours` (the daily values use only whole 12Z-12Z days). Names: wind (10 m u and v), mslp, frz (freezing level),
# refc (simulated composite reflectivity), ptype (precipitation type), rh (2 m relative humidity;
# ECMWF from dewpoint), smoke (near-surface smoke, HRRR/RRFS). A field a model doesn't publish is
# skipped and logged.
# ----------------------------------------------------------------------------
grib_models:
  # regional, convection-allowing
  - {id: hrrr, label: HRRR, tier: regional, family: ncep, herbie: {model: hrrr, product: sfc},
     cycles: [0, 6, 12, 18], max_hours: 48, range_days: 2, sample_hours: 3, chain_step: 1,
     extremes: {step: 1, wind: max},                          # no 2 m max/min: hourly temperature
     fields: {hourly: [refc, ptype, t2m, gust, wind, mslp, frz, rh, smoke], hourly_hours: 48, stepped: [wind, mslp, frz, rh]}}
  - {id: rrfs, label: RRFS, tier: regional, family: ncep,
     herbie: {model: rrfs, product: 2dfld, domain: conus},   # operational RRFS: deterministic = no member
     cycles: [0, 6, 12, 18], max_hours: 84, range_days: 3, sample_hours: 3, chain_step: 1,
     extremes: {step: 1, temp: maxmin, wind: max},
     fields: {hourly: [refc, ptype, t2m, gust, wind, mslp, frz, rh, smoke], hourly_hours: 48,
              stepped: [wind, mslp, frz, rh, refc, ptype, smoke]}}           # every 3 h from 48 h to 84 h
  - {id: namnest, label: NAM 3 km, tier: regional, family: ncep,
     herbie: {model: nam, product: conusnest.hiresf},
     cycles: [0, 6, 12, 18], max_hours: 60, range_days: 2, sample_hours: 3, chain_step: 1,
     extremes: {step: 1, temp: maxmin, wind: maxuv},          # max wind as components
     fields: {hourly: [refc, ptype, t2m, gust, wind, mslp, frz, rh], hourly_hours: 48,
              stepped: [wind, mslp, frz, rh, refc, ptype]}}                  # every 3 h from 48 h to 60 h
  # blend
  - {id: nbm, label: NBM, tier: blend, family: ncep, herbie: {model: nbm, product: co},
     cycles: [0, 6, 12, 18], max_hours: 264, range_days: 11, sample_hours: 6, chain_step: 6,
     extremes: {steps: [[36, 1], [192, 3], [264, 6]], temp: maxmin, wind: speed}}   # 12-h highs/lows
  # global
  - {id: gfs, label: GFS, tier: global, family: ncep, herbie: {model: gfs, product: pgrb2.0p25},
     cycles: [0, 6, 12, 18], max_hours: 384, range_days: 14, sample_hours: 6,
     extremes: {step: 3, temp: maxmin},                       # 6-h (3-h after day 5) max/min
     ivt: true,                                               # water vapour transport (AR scale)
     fields: {stepped: [wind, mslp, frz, ptype, rh]}}
  - {id: ifs, label: ECMWF IFS, tier: global, family: ecmwf, herbie: {model: ifs, product: oper},
     cycles: [0, 12], max_hours: 240, range_days: 14, sample_hours: 6,
     extremes: {steps: [[144, 3], [360, 6]], temp: maxmin},  # mx2t3/mn2t3, then mx2t6/mn2t6
     fields: {stepped: [wind, mslp, ptype, rh]}}
  - {id: aifs, label: ECMWF AIFS, tier: global, family: ecmwf, herbie: {model: aifs, product: oper},
     cycles: [0, 12], max_hours: 360, range_days: 14, sample_hours: 6, gust: false,
     ivt: true,
     fields: {stepped: [wind, mslp, ptype, rh]}}

grib_ensembles:
  - {id: gefs, label: GEFS, family: ncep, herbie: {model: gefs, product: atmos.5},
     probe_member: {member: c00}, cycles: [0, 6, 12, 18], max_hours: 384, range_days: 14,
     members: [c00, p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12, p13, p14, p15,
               p16, p17, p18, p19, p20, p21, p22, p23, p24, p25, p26, p27, p28, p29, p30]}
  - {id: ens, label: ECMWF ENS, family: ecmwf, herbie: {model: ifs, product: enfo},
     cycles: [0, 12], max_hours: 360, range_days: 14, snow: true}   # snowfall for pass-snow odds

# ----------------------------------------------------------------------------
# Optional supplement: models with no public GRIB feed, from Open-Meteo
# (non-commercial free tier). Set `enabled: false` to run on GRIB alone.
# `ids` lists candidate API names; the first one that answers is used.
# ----------------------------------------------------------------------------
supplement:
  enabled: true
  point_models:
    - {ids: [cmc_gem_hrdps, gem_hrdps_continental], label: HRDPS, tier: regional}
    - {ids: [gem_seamless, gem_global],             label: Canadian GEM, tier: global}
    - {ids: [icon_seamless, icon_global],           label: DWD ICON, tier: global}
    - {ids: [ukmo_seamless, ukmo_global_deterministic_10km], label: UK Met Office, tier: global}
    - {ids: [meteofrance_seamless, meteofrance_arpege_world], label: Météo-France, tier: global}
    - {ids: [jma_seamless, jma_gsm],                label: JMA, tier: global, timing: false}   # 3 – 6-hourly steps over the region
  ensemble_models:
    - {ids: [gem_global],                           label: Canadian GEPS}

# Impact thresholds (US units: inches, °F, mph).
# A hazard is flagged when at least `min_agreement` of models exceed it.
impacts:
  min_agreement: 0.3
  heavy_rain_24h:   {lowland: 1.25, coast: 2.5, pass: 3.0}
  heavy_rain_72h:   {lowland: 2.5,  coast: 5.0, pass: 6.0}   # atmospheric-river / flood signal
  snow_24h:         {lowland: 1.0,  coast: 1.0, pass: 8.0}
  hard_freeze_f:    {lowland: 27,   coast: 27,  pass: null}
  freezing_precip_f: 32      # min temp <= this AND precip >= 0.05" -> frozen/icing precip possible
  # Gusts: "worth watching" where scattered power outages start, and "significant" at NWS High
  # Wind Warning strength (58 mph, mountains 75). While deciduous trees are in leaf the lowland
  # level drops (NWS Seattle uses 35 mph then), and after a multi-day rain event (heavy_rain_72h)
  # it drops by wind_wet_soil_drop_mph for that day and the two after: trees in saturated soil
  # come down at lower gusts.
  wind_gust_mph:        {lowland: 40,   coast: 50,  pass: 60}
  wind_gust_leaf_mph:   {lowland: 35,   coast: 50,  pass: 60}
  wind_gust_severe_mph: {lowland: 58,   coast: 65,  pass: 75}
  wind_widespread_mph: 45            # this many lowland locations at advisory strength is also significant
  wind_widespread_points: 3
  leaf_season: ["09-01", "11-15"]    # MM-DD, inclusive
  wind_wet_soil_drop_mph: 5
  heat_f:           {lowland: 90,   coast: 85,  pass: null}

# ----------------------------------------------------------------------------
# Forecast context
#
# Pressure gradients: station A minus station B in hPa, from each model's sea-level pressure.
# The thresholds are rules of thumb for where impacts usually start; adjust to taste.
gradients:
  - {id: olm_bli, a: {name: Olympia, code: OLM, lat: 46.97, lon: -122.90}, b: {name: Bellingham, code: BLI, lat: 48.79, lon: -122.54},
     meaning: "South wind through Puget Sound when positive",
     thresholds: [{value: 8, label: "Gusty south winds"}, {value: 12, label: "Windstorm range"}]}
  - {id: eug_pdx, a: {name: Eugene, code: EUG, lat: 44.12, lon: -123.21}, b: {name: Portland, code: PDX, lat: 45.59, lon: -122.60},
     meaning: "South wind in the Willamette Valley when positive",
     thresholds: [{value: 6, label: "Gusty south winds"}, {value: 10, label: "Windstorm range"}]}
  - {id: dls_ttd, a: {name: The Dalles, code: DLS, lat: 45.62, lon: -121.17}, b: {name: Troutdale, code: TTD, lat: 45.55, lon: -122.40},
     meaning: "East wind through the Columbia Gorge when positive",
     thresholds: [{value: 8, label: "Strong Gorge east wind"}, {value: 12, label: "Damaging Gorge winds"}]}
  - {id: sea_ykm, a: {name: Seattle, code: SEA, lat: 47.45, lon: -122.31}, b: {name: Yakima, code: YKM, lat: 46.57, lon: -120.54},
     meaning: "Onshore push (west winds through the passes) when positive; offshore, east winds when negative",
     thresholds: [{value: 8, label: "Strong onshore push"}, {value: -8, label: "Strong offshore flow"}]}
  # Williams Lake is north of the map area: its pressure is read from each model's full grid
  # before cropping, so models whose grid stops short of 52°N (HRRR, NAM) leave this one out.
  - {id: bli_ywl, a: {name: Bellingham, code: BLI, lat: 48.79, lon: -122.54}, b: {name: Williams Lake, code: YWL, lat: 52.18, lon: -122.05},
     meaning: "Fraser outflow (northeast winds in Whatcom County and the San Juans) when negative",
     thresholds: [{value: -10, label: "Outflow winds likely"}, {value: -16, label: "Strong outflow"}]}

# Snow level at the passes: each model's freezing level minus this offset (snow usually reaches
# the ground about 1,000 ft below the freezing level). Pass elevations are `elev_ft` on the points.
snow_level_offset_ft: 1000

# Ensemble odds maps (interactive map, Summary mode): fixed amounts, since a map can't switch
# thresholds by place. Location odds use the impacts thresholds above.
odds_map: {rain24_in: 1.0, rain72_in: 3.0}

# Landslide risk: the USGS cumulative rainfall threshold for the Seattle area (OFR 2006-1064),
# P3 >= 3.5 - 0.67 * P15 inches, run from observed rain into each model's forecast. It was
# calibrated for Seattle and the nearby Puget Sound bluffs, so keep the list to that area.
landslide:
  points: [Everett, Seattle, Tacoma]
  threshold_in: 3.5
  p15_factor: 0.67

# Avalanche danger from the Northwest Avalanche Center, via avalanche.org's public API.
avalanche:
  center: NWAC

# Observed reports by location (obsreports.py): the station that stands for each forecast location.
# asos: IEM station id (state ASOS network, or CA_BC_ASOS for C-prefixed ids) for daily
# precipitation and peak gust; eccc: Environment Canada climate id for B.C. daily precipitation
# and gust (a day or so behind); snotel: NRCS triplet for precipitation and new snow at the passes.
obs_reports:
  days: 3                       # full days before today, plus today so far
  report_hours: 48              # NWS reports drop out this long after the event
  lsr_wfos: [SEW, PQR]          # NWS offices (Seattle, Portland) whose storm reports and report summaries to include
  stations:
    Bellingham: {asos: BLI}
    Everett: {asos: PAE}
    Seattle: {asos: SEA}
    Tacoma: {asos: TIW}
    Olympia: {asos: OLM}
    Forks: {asos: UIL}
    Aberdeen: {asos: HQM}
    Stevens Pass: {snotel: "791:WA:SNTL"}
    Snoqualmie Pass: {snotel: "672:WA:SNTL"}
    White Pass: {snotel: "863:WA:SNTL"}
    Vancouver WA: {asos: VUO}
    Astoria: {asos: AST}
    Tillamook: {asos: TMK}
    Portland: {asos: PDX}
    Salem: {asos: SLE}
    Corvallis: {asos: CVO}
    Government Camp: {snotel: "651:OR:SNTL"}
    Vancouver BC: {asos: CYVR, eccc: "1108395"}
    Whistler BC: {asos: CWAE}

