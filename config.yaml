    - {name: Central Puget Sound,    lat: 47.65, lon: -122.42, near: Seattle, area: Strait and Puget Sound}
    - {name: Southern Strait of Georgia, lat: 49.05, lon: -123.25, near: Vancouver BC, area: B.C. waters}
  tides:
    - {id: "9443090", name: Neah Bay,      area: Outer coast}
    - {id: "9442396", name: La Push,       near: Forks, area: Outer coast}
    - {id: "9441102", name: Westport,      near: Aberdeen, area: Outer coast}
    - {id: "9440910", name: Toke Point (Willapa Bay), area: Outer coast}
    - {id: "9439040", name: Astoria,       near: Astoria, area: Outer coast}
    - {id: "9437540", name: Garibaldi,     near: Tillamook, area: Outer coast}
    - {id: "9435380", name: South Beach (Newport), area: Outer coast}
    - {id: "9444090", name: Port Angeles,  area: Strait and Puget Sound, flood: false}   # its published flood level is on another datum
    - {id: "9444900", name: Port Townsend, area: Strait and Puget Sound}
    - {id: "9449880", name: Friday Harbor, area: Strait and Puget Sound}
    - {id: "9449424", name: Cherry Point,  near: Bellingham, area: Strait and Puget Sound}
    - {id: "9447130", name: Seattle,       near: Seattle, area: Strait and Puget Sound}
    - {id: "9446484", name: Tacoma,        near: Tacoma, area: Strait and Puget Sound}

# Snowpack: SNOTEL stations within `radius_km` of each area's centre. Percent of median is shown
# once the area's median SWE reaches `min_median_in` (early-season medians are near zero).
snowpack:
  radius_km: 30
  min_median_in: 1.0
  states: [WA, OR]
  areas:
    - {name: Mt Baker,          lat: 48.85, lon: -121.68}
    - {name: Olympics,          lat: 47.85, lon: -123.45}
    - {name: Stevens Pass,      lat: 47.75, lon: -121.09}
    - {name: Snoqualmie Pass,   lat: 47.42, lon: -121.41}
    - {name: Rainier and White Pass, lat: 46.75, lon: -121.55}
    - {name: Mt Hood,           lat: 45.33, lon: -121.71}
    - {name: Santiam Pass,      lat: 44.42, lon: -121.87}

# NWS offices whose Area Forecast Discussions are summarised (synopsis, key messages, hydrology)
nws_offices: [SEW, PQR]

# ----------------------------------------------------------------------------
# NWS alerts and normals
# ----------------------------------------------------------------------------
nws_areas: [WA, OR]          # states queried for active alerts
nws_user_agent: "(pnw-briefing, nshipes@urban10.com)"   # optional; defaults to the GitHub repo name
cache_dir: .cache            # PRISM normals are cached here between runs

# ----------------------------------------------------------------------------
# Headline and lead. The facts come from the briefing's data; when the OPENAI_API_KEY secret is
# set, an OpenAI model words them (numbers it uses are checked against the facts). Without the
# key, or if the model's text fails the check, rule-based sentences are used instead.
# ----------------------------------------------------------------------------
summary:
  enabled: true
  model: gpt-4.1-mini

# ----------------------------------------------------------------------------
# Peak timing: when the strongest gusts and heaviest precipitation come at each location over
# the next two days, from the models with hourly output (multi-model median, weighted). A location
# shows a period only when the median gust reaches gust_mph (by kind) or the hourly
# precipitation rate reaches rate_in_per_h (moderate rain); heavy_in_per_h marks heavy rates.
# ----------------------------------------------------------------------------
timing:
  gust_mph: {lowland: 35, coast: 45, pass: 50}
  rate_in_per_h: 0.10
  heavy_in_per_h: 0.30
  hours: 48
  weights: {regional: 2, blend: 1, global: 1}   # high-resolution models count double in the median
