<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#334"/></marker>
    <marker id="sun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c98a00"/></marker>
    <radialGradient id="cl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9fb3c8" stop-opacity=".85"/><stop offset="1" stop-color="#9fb3c8" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- ground -->
  <path d="M60 330 L700 330" stroke="#8a7a62" stroke-width="2"/>
  <path d="M330 330 L380 296 L410 312 L450 280 L500 330 Z" fill="#cdbb9b" stroke="#8a7a62"/>
  <text x="318" y="350" fill="#6b5d48">terrain (rays stop here)</text>
  <!-- box -->
  <rect x="180" y="90" width="460" height="240" fill="none" stroke="#7d8798" stroke-dasharray="5 4"/>
  <text x="648" y="96" fill="#556">top: 12 km × exaggeration</text>
  <text x="648" y="326" fill="#556">0 km</text>
  <!-- cloud -->
  <ellipse cx="360" cy="190" rx="120" ry="55" fill="url(#cl)"/>
  <ellipse cx="420" cy="170" rx="80" ry="40" fill="url(#cl)"/>
  <!-- camera -->
  <g transform="translate(40,60)"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#334"/><circle cx="16" cy="0" r="6" fill="#334"/></g>
  <text x="18" y="40" fill="#334">camera (pixel)</text>
  <!-- ray -->
  <line x1="58" y1="66" x2="630" y2="328" stroke="#334" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- samples -->
  <g fill="#2f6fd6">
    <circle cx="205" cy="133.3" r="4"/><circle cx="245" cy="151.6" r="4"/><circle cx="285" cy="169.9" r="4"/><circle cx="325" cy="188.2" r="4"/>
    <circle cx="365" cy="206.5" r="4"/><circle cx="405" cy="224.8" r="4"/><circle cx="445" cy="243.1" r="4"/>
  </g>
  <text x="196" y="112" fill="#2f6fd6">tn: the ray enters the box</text>
  <text x="470" y="232" fill="#2f6fd6">stops when opaque (α &gt; 0.97),</text>
  <text x="470" y="248" fill="#2f6fd6">at the terrain, or at tf (exit)</text>
  <!-- step label -->
  <text x="20" y="355" fill="#2f6fd6" font-size="12">step dt: 192 across the box diagonal</text><text x="20" y="369" fill="#2f6fd6" font-size="12">(96 while the map moves), jittered per pixel</text>
  <!-- light rays from samples -->
  <g stroke="#c98a00" stroke-width="1.3" stroke-dasharray="3 3">
    <line x1="325" y1="188.2" x2="270" y2="110" marker-end="url(#sun)"/>
    <line x1="405" y1="224.8" x2="350" y2="146" marker-end="url(#sun)"/>
  </g>
  <text x="196" y="80" fill="#a87300">6 taps toward the light: how much cloud shades each sample</text>
  <!-- sun -->
  <circle cx="110" cy="40" r="0" />
  <!-- shadow ray from ground -->
  <g stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"><line x1="600" y1="330" x2="545" y2="250"/></g>
  <circle cx="600" cy="330" r="4" fill="#555"/>
  <text x="520" y="380" fill="#444">ground shadow: 56 taps from the</text><text x="520" y="396" fill="#444">ground toward the light</text>
  <!-- compositing formula -->
  <text x="20" y="410" fill="#334" font-size="12">front to back: c += (1 − α)·a·colour,  α += (1 − α)·a,  a = 1 − exp(−extinction·density·step)</text>
</svg>
